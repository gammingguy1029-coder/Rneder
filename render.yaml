services:
  - type: web
    name: shadowblog
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shadowblog-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: shadowblog-db
    databaseName: shadowblog
    plan: free
